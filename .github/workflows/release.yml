name: Build and publish Windows release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Validate release version
        shell: pwsh
        run: |
          $version = python -c 'from core.constants import APP_VERSION; print(APP_VERSION)'
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+(?:\.\d+)?$') { throw 'Invalid APP_VERSION' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match APP_VERSION' }
          } elseif ((git log -1 --format=%s) -cne "Release $tag") {
            throw 'A release commit must be titled exactly Release v<APP_VERSION>'
          }
          if (-not (Test-Path -LiteralPath "docs/releases/$tag.md")) { throw 'Missing release notes' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build and self-test installer and portable package
        shell: pwsh
        run: ./scripts/build_release.ps1 -Clean
      - name: Publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $folder = "release/$env:RELEASE_VERSION"
          $notes = "docs/releases/$tag.md"
          $assets = @("$folder/AtlasXCursorStudio-Setup-$env:RELEASE_VERSION.exe", "$folder/AtlasXCursorStudio-portable-$env:RELEASE_VERSION.zip", "$folder/SHA256SUMS.txt")
          foreach ($asset in $assets) { if (-not (Test-Path -LiteralPath $asset)) { throw "Missing asset: $asset" } }
          # Never attach new binaries to a tag pointing at a different commit.
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the release tag' }
          if ($remoteTag) {
            $target = (@($remoteTag)[-1] -split '\s+')[0]
            if ($target -ne $env:GITHUB_SHA) { throw 'Release tag points at a different commit' }
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { throw 'Release tag vanished during build' }
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { Write-Host "Already published: $tag"; exit 0 }
            gh release upload $tag @assets --clobber
          } else {
            $targetArgs = if ($remoteTag) { '--verify-tag' } else { '--target', $env:GITHUB_SHA }
            gh release create $tag @assets @targetArgs --draft --title "Atlas-X Cursor Studio $tag" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit $tag --draft=false --latest --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
